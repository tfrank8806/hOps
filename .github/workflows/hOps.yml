name: Build and deploy .NET Core application to Web App hOps
permissions:
  contents: read
on:
  push:
    branches:
    - main
env:
  AZURE_WEBAPP_NAME: hOps
  AZURE_WEBAPP_PACKAGE_PATH: .\publish\hOps.web.zip
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  PUBLISH_DIRECTORY: .\publish
  SOLUTION_FILE: hOps.web/hOps.web.sln
  WEB_PROJECT: hOps.web/hOps.web.csproj
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.SOLUTION_FILE }}"
    - name: Build
      run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test "${{ env.SOLUTION_FILE }}" --no-build
    - name: Publish
      run: dotnet publish "${{ env.WEB_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.PUBLISH_DIRECTORY }}"
    - name: Archive published output
      shell: pwsh
      run: |
        $packagePath = "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
        $publishDir = "${{ env.PUBLISH_DIRECTORY }}"
        if (Test-Path $packagePath) {
          Remove-Item -Path $packagePath -Force
        }
        $packageDir = Split-Path -Path $packagePath -Parent
        if ($packageDir -and -not (Test-Path $packageDir)) {
          New-Item -ItemType Directory -Path $packageDir | Out-Null
        }
        Compress-Archive -Path "$publishDir\*" -DestinationPath $packagePath
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    runs-on: windows-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.PUBLISH_DIRECTORY }}
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.hOps_SPN }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
